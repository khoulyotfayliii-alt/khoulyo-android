name: Build Khoulyo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q KhoulyoAndroid-FINAL.zip -d project
          GRADLEW=$(find project -type f -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khoulyo-APK
          path: project/**/build/outputs/apk/debug/*.apk
